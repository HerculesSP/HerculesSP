# Galaxy Profile README Configuration
# Copy this file to config.yml and customize it to make it your own!
#
# Usage:
#   cp config.example.yml config.yml
#   # Edit config.yml with your details
#   python -m generator.main
#
# Demo mode (no API calls, uses this file directly):
#   python -m generator.main --demo

# Your GitHub username (required)
username: HerculesSP

# Profile information. name, tagline and philosophy are drawn in the galaxy header;
# company, location and bio are not drawn: keep them here for your own reference.
profile:
  name: "Hércules da S. Pereira"
  tagline: "Backend Developer"
  company: "CI&T"
  location: "São Paulo, SP"
  bio: |
    Hi, I am Hercules! I’m from Cotia, in the state of São Paulo. I’ve been passionate about technology since I was a child, 
    studied Systems Development at ETEC Raposo Tavares, and am currently pursuing a degree in Computer Science at São Paulo Tech School. 
    I’m an intern at CI&T, working in back-end development.


  philosophy: '"Si vis pacem, para bellum."'

# Social links. Not drawn in the images: write them in your README (see README.profile.md)
social:
  email: "nyx@stellarlabs.dev"
  linkedin: "herculessp"
  #website: "https://nyxorion.dev"

# Galaxy arms are your focus areas.
# A focus area becomes an arm of the galaxy when at least one of your public
# repositories belongs to it, and the arm grows with the number of repositories.
# A repository belongs to the area whose `items` make up the largest share of
# its code (15% or more). Items that are not languages (React, AWS...) are
# still listed in the tech-stack image.
galaxy_arms:
  - name: "Backend"
    items:
      - "Java"
      - "Spring Boot"
      - "Python"
      - "C#"
      - "MySQL"
    repos:
      - "pezao-sound-projeto-de-extensao/Back-end"
      - "HerculesSP/Task-Management-API"
      - "HerculesSP/Clean-Architecture"

  - name: "Frontend"
    items:
      - "JavaScript"
      - "React"
      - "CSS"

  - name: "DevOps"
    items:
      - "Terraform"
      - "HCL"
      - "Ansible"
      - "GitHub Actions"
      - "Docker"
    repos:
      - "HerculesSP/DevOps-AWS"
      - "HerculesSP/IaC-AWS"

  - name: "Cloud"
    items:
      - "Azure"
      - "AWS"

    repos:
      - "HerculesSP/az-func-validacao-cpf-"
      - "HerculesSP/gerenciador-de-catalogo-da-netflix"

  - name: "Linguagens"
    items:
      - "Paulistanes"
    repos:
      - "HerculesSP/Paulistanes"

# Featured projects, shown in their own image and named in the galaxy.
# Each project needs:
#   repo: "owner/repo-name"   — GitHub repository path (another owner's is fine)
#   description: "..."        — Short description; defaults to the repository's own
# and may have:
#   arm: 0                    — Pin it to a galaxy arm by index (0 is the first)
projects:

  - repo: "HerculesSP/Paulistanes"
    description: "Linguagem de programação desenvolvida com python."
    arm: 4

  - repo: "pezao-sound-projeto-de-extensao/Back-end"
    description: "API backend em Java com Docker Compose e banco SQL."
    arm: 0

  - repo: "HerculesSP/DevOps-AWS"
    description: "Infraestrutura AWS com Terraform e Ansible."
    arm: 2
# Theme: one palette for GitHub's dark theme and one for its light theme.
#   deep-sky   — a night sky, with stars in their real colours
#   cyanotype  — Prussian blue and paper white, with one warm accent
theme:
  dark: "deep-sky"
  light: "deep-sky"
  # Fine tuning of the dark palette (optional, hex colours). The values below are
  # the version 1 defaults, which are ignored as such: a colour only takes effect
  # once you change it.
  # void: "#080c14"            # Background
  # text_bright: "#f1f5f9"     # Primary text
  # text_dim: "#94a3b8"        # Secondary text
  # text_faint: "#64748b"      # Hairlines
  # synapse_cyan: "#00d4ff"    # Active stars, first dust colour
  # dendrite_violet: "#a78bfa" # Second dust colour
  # axon_amber: "#ffb020"      # Dormant stars, third dust colour

# Motion: set to false for still images.
# Visitors whose system asks for reduced motion always get still images.
motion: true

# Stats configuration — which counters to show beside the contribution chart
# (the chart's own title is the number of contributions; up to three of the rest are shown)
stats:
  metrics:
    - "commits"
    - "stars"
    - "prs"
    - "issues"
    - "repos"

# Language display settings
languages:
  exclude:                     # Languages to hide from the languages image
    - "HTML"
    - "CSS"
    - "Shell"
    - "Makefile"
  max_display: 8               # Maximum number of languages to show
